<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | Chat 01</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #1a1a1a; color: white; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; padding: 20px;
        }
        .login-box { 
            background: #2d2d2d; padding: 40px; border-radius: 12px; 
            text-align: center; width: 100%; max-width: 380px;
        }
        h1 { color: #4d6bfe; margin-bottom: 25px; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            border-radius: 8px; border: 1px solid #444; 
            background: #1a1a1a; color: white; font-size: 16px;
        }
        button { 
            background: #4d6bfe; color: white; border: none; 
            padding: 12px; border-radius: 8px; cursor: pointer; 
            width: 100%; font-size: 16px; margin-top: 15px;
        }
        button:hover { background: #3a55d9; }
        .hint { font-size: 12px; color: #888; margin-top: 20px; }
        
        /* تنظیمات موبایل */
        @media (max-width: 480px) {
            .login-box { padding: 25px; }
            h1 { font-size: 20px; }
            input, button { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>DeepChat</h1>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="ایمیل یا شماره تلفن" required>
            <input type="password" name="password" placeholder="رمز عبور (فقط برای ادمین)" autocomplete="off">
            <button type="submit">ورود / ثبت‌نام</button>
        </form>
        <p class="hint">برای ساخت ادمین اولیه یک بار به آدرس /create_admin بروید.</p>
    </div>
</body>
</html>
