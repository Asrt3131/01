<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعیین رمز ادمین</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #2d2d2d; padding: 40px; border-radius: 12px; text-align: center; width: 350px; }
        h1 { color: #4d6bfe; font-size: 20px; margin-bottom: 20px; }
        p { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: white; text-align: center; font-size: 16px; }
        button { background: #4d6bfe; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #3a55d9; }
    </style>
</head>
<body>
    <div class="box">
        <h1>تعیین رمز برای پنل ادمین</h1>
        <p>برای امنیت بیشتر، یک رمز عبور قوی (حداقل ۸ کاراکتر) تعیین کنید.</p>
        <form action="/set_password" method="post">
            <input type="password" name="new_password" placeholder="رمز عبور جدید" required minlength="8">
            <button type="submit">ذخیره رمز</button>
        </form>
    </div>
</body>
</html>
